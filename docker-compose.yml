version: '3.8'

services:
  # Spring Boot 应用
  nginx-controller:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - nginx-network
    container_name: nginx-controller-app
    restart: unless-stopped

  # Nginx 代理服务器
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8881:8881"
      - "8882:8882"
      - "8883:8883"
      - "8884:8884"
      - "8885:8885"
      - "8886:8886"
      - "8887:8887"
      - "8888:8888"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx-controller
    networks:
      - nginx-network
    container_name: nginx-proxy
    restart: unless-stopped

networks:
  nginx-network:
    driver: bridge