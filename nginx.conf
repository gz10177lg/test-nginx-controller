user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 场景1: location带斜杠 + proxy_pass只有端口 + 不带斜杠
    server {
        listen 8881;
        location /api/ {
            proxy_pass http://nginx-controller-app:8080;
        }
    }

    # 场景2: location带斜杠 + proxy_pass只有端口 + 带斜杠
    server {
        listen 8882;
        location /api/ {
            proxy_pass http://nginx-controller-app:8080/;
        }
    }

    # 场景3: location带斜杠 + proxy_pass有路径 + 不带斜杠
    server {
        listen 8883;
        location /api/ {
            proxy_pass http://nginx-controller-app:8080/backend;
        }
    }

    # 场景4: location带斜杠 + proxy_pass有路径 + 带斜杠
    server {
        listen 8884;
        location /api/ {
            proxy_pass http://nginx-controller-app:8080/backend/;
        }
    }

    # 场景5: location不带斜杠 + proxy_pass只有端口 + 不带斜杠
    server {
        listen 8885;
        location /api {
            proxy_pass http://nginx-controller-app:8080;
        }
    }

    # 场景6: location不带斜杠 + proxy_pass只有端口 + 带斜杠
    server {
        listen 8886;
        location /api {
            proxy_pass http://nginx-controller-app:8080/;
        }
    }

    # 场景7: location不带斜杠 + proxy_pass有路径 + 不带斜杠
    server {
        listen 8887;
        location /api {
            proxy_pass http://nginx-controller-app:8080/backend;
        }
    }

    # 场景8: location不带斜杠 + proxy_pass有路径 + 带斜杠
    server {
        listen 8888;
        location /api {
            proxy_pass http://nginx-controller-app:8080/backend/;
        }
    }
}