user nobody;
worker_processes auto;
error_log /opt/homebrew/var/log/nginx/error.log;
pid /opt/homebrew/var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /opt/homebrew/var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    # =============================================
    # 场景1: location带斜杠 + proxy_pass只有端口 + 不带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/api/hello
    # =============================================
    server {
        listen 8881;
        location /api/ {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景2: location带斜杠 + proxy_pass只有端口 + 带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/hello
    # =============================================
    server {
        listen 8882;
        location /api/ {
            proxy_pass http://localhost:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景3: location带斜杠 + proxy_pass有路径 + 不带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/backendhello
    # =============================================
    server {
        listen 8883;
        location /api/ {
            proxy_pass http://localhost:8080/backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景4: location带斜杠 + proxy_pass有路径 + 带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/backend/hello
    # =============================================
    server {
        listen 8884;
        location /api/ {
            proxy_pass http://localhost:8080/backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景5: location不带斜杠 + proxy_pass只有端口 + 不带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/api/hello
    # =============================================
    server {
        listen 8885;
        location /api {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景6: location不带斜杠 + proxy_pass只有端口 + 带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080//hello
    # =============================================
    server {
        listen 8886;
        location /api {
            proxy_pass http://localhost:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景7: location不带斜杠 + proxy_pass有路径 + 不带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/backend/hello
    # =============================================
    server {
        listen 8887;
        location /api {
            proxy_pass http://localhost:8080/backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # =============================================
    # 场景8: location不带斜杠 + proxy_pass有路径 + 带斜杠
    # 请求: GET /api/hello
    # 预估: 转发到 http://localhost:8080/backend//hello
    # =============================================
    server {
        listen 8888;
        location /api {
            proxy_pass http://localhost:8080/backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}